<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX → MathML для SKB</title>

  <script>
    window.MathJax = {
      startup: {
        typeset: false
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #1d1f23;
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }
    .desc {
      margin: 0 0 22px;
      color: #5f6670;
      line-height: 1.5;
    }
    .status {
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff8db;
      border: 1px solid #ead98a;
      font-size: 14px;
    }
    .status.ok {
      background: #eaf7ee;
      border-color: #acd5b8;
    }
    .status.error {
      background: #fdecec;
      border-color: #e3abab;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 14px;
      cursor: pointer;
      background: #222;
      color: #fff;
    }
    button.secondary {
      background: #e5e7eb;
      color: #222;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .card {
      background: white;
      border: 1px solid #dfe2e6;
      border-radius: 12px;
      padding: 16px;
      min-width: 0;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 17px;
    }
    textarea {
      width: 100%;
      min-height: 500px;
      resize: vertical;
      border: 1px solid #cfd3d8;
      border-radius: 8px;
      padding: 12px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
    }
    textarea:focus {
      border-color: #777;
    }
    .preview {
      margin-top: 18px;
      background: white;
      border: 1px solid #dfe2e6;
      border-radius: 12px;
      padding: 16px;
    }
    .preview h2 {
      margin: 0 0 10px;
      font-size: 17px;
    }
    #previewBox {
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      min-height: 120px;
      padding: 16px;
      overflow: auto;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .count {
      margin-left: auto;
      align-self: center;
      color: #5f6670;
      font-size: 14px;
    }
    code {
      background: #eef0f2;
      border-radius: 4px;
      padding: 2px 5px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      textarea { min-height: 350px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>LaTeX → MathML</h1>
    <p class="desc">
      Находит формулы между <code>$...$</code>, преобразует LaTeX в MathML через MathJax
      и добавляет атрибуты, похожие на формулы из редактора SKB.
    </p>

    <div id="status" class="status">Загрузка MathJax…</div>

    <div class="actions">
      <button id="convertBtn">Преобразовать формулы</button>
      <button id="copyBtn" class="secondary">Скопировать результат</button>
      <button id="sampleBtn" class="secondary">Вернуть пример</button>
      <button id="clearBtn" class="secondary">Очистить</button>
      <span id="count" class="count">Формул: 0</span>
    </div>

    <div class="grid">
      <div class="card">
        <h2>1. Исходный текст</h2>
        <textarea id="input"></textarea>
      </div>

      <div class="card">
        <h2>2. Результат с MathML</h2>
        <textarea id="output" readonly></textarea>
      </div>
    </div>

    <div class="preview">
      <h2>Предпросмотр результата</h2>
      <div id="previewBox"></div>
    </div>
  </div>

<script>
const sampleText = String.raw`Нейронным сетям намного проще работать с нормализованными данными.

**Шаг 1. Поиск среднего значения ($\bar{x}$)**

Складываем все числа и делим результат на их количество:

$\bar{x} = \frac{1 + 0 + 3 + 2 + 4}{5} = \frac{10}{5} = 2$

где $\bar{x}$ — среднее значение.

**Шаг 2. Поиск дисперсии ($\sigma^2$) и стандартного отклонения ($\sigma$)**

Формула дисперсии:

$\sigma^2 = \frac{\sum (x_i - \bar{x})^2}{n}$

где:
- $\sigma^2$ — дисперсия,
- $x_i$ — текущее число,
- $\bar{x}$ — среднее значение,
- $n$ — количество элементов.`;

const input = document.getElementById('input');
const output = document.getElementById('output');
const previewBox = document.getElementById('previewBox');
const statusBox = document.getElementById('status');
const countBox = document.getElementById('count');

input.value = sampleText;

function setStatus(text, type = '') {
  statusBox.textContent = text;
  statusBox.className = 'status' + (type ? ' ' + type : '');
}

async function waitForMathJax() {
  try {
    if (!window.MathJax) throw new Error('MathJax не найден');
    if (MathJax.startup && MathJax.startup.promise) {
      await MathJax.startup.promise;
    }
    if (typeof MathJax.tex2mmlPromise !== 'function') {
      throw new Error('Функция tex2mmlPromise недоступна');
    }
    setStatus('MathJax загружен. Можно преобразовывать.', 'ok');
  } catch (err) {
    setStatus('Ошибка загрузки MathJax: ' + err.message, 'error');
  }
}

function findDollarFormulas(text) {
  const matches = [];
  let i = 0;

  while (i < text.length) {
    if (text[i] !== '$' || (i > 0 && text[i - 1] === '\\')) {
      i++;
      continue;
    }

    // Не обрабатываем $$...$$ в этой тестовой версии как отдельный синтаксис.
    if (text[i + 1] === '$') {
      const end = text.indexOf('$$', i + 2);
      if (end !== -1) {
        matches.push({ start: i, end: end + 2, latex: text.slice(i + 2, end), display: true });
        i = end + 2;
        continue;
      }
    }

    let j = i + 1;
    while (j < text.length) {
      if (text[j] === '$' && text[j - 1] !== '\\') break;
      j++;
    }

    if (j < text.length) {
      matches.push({ start: i, end: j + 1, latex: text.slice(i + 1, j), display: false });
      i = j + 1;
    } else {
      i++;
    }
  }

  return matches;
}

function normalizeMathML(mathml) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(mathml, 'application/xml');
  const math = doc.documentElement;

  if (math.nodeName.toLowerCase() !== 'math') {
    throw new Error('MathJax вернул неожиданный формат');
  }

  math.setAttribute('xmlns', 'http://www.w3.org/1998/Math/MathML');
  math.setAttribute('display', 'block');
  math.setAttribute('data-fr-type', 'latex');
  math.setAttribute('class', 'fr-mml-formula');

  return new XMLSerializer().serializeToString(math);
}

async function convertAll() {
  try {
    setStatus('Преобразование…');
    await waitForMathJax();

    const text = input.value;
    const formulas = findDollarFormulas(text);

    if (!formulas.length) {
      output.value = text;
      previewBox.textContent = text;
      countBox.textContent = 'Формул: 0';
      setStatus('Формулы между $...$ не найдены.', 'ok');
      return;
    }

    let result = '';
    let cursor = 0;

    for (const formula of formulas) {
      result += text.slice(cursor, formula.start);

      const latex = formula.latex.trim();
      if (!latex) {
        result += text.slice(formula.start, formula.end);
        cursor = formula.end;
        continue;
      }

      try {
        const rawMathML = await MathJax.tex2mmlPromise(latex, {
          display: formula.display
        });
        result += normalizeMathML(rawMathML);
      } catch (formulaError) {
        // Если одна формула сломана, оставляем её как есть, а не ломаем весь текст.
        result += text.slice(formula.start, formula.end);
        console.error('Ошибка формулы:', latex, formulaError);
      }

      cursor = formula.end;
    }

    result += text.slice(cursor);

    output.value = result;
    countBox.textContent = 'Формул: ' + formulas.length;

    // Предпросмотр: текст показывается как HTML только для демонстрации MathML.
    // Остальной исходный текст предварительно экранируем.
    const container = document.createElement('div');
    let previewHTML = escapeNonMath(result);
    previewBox.innerHTML = previewHTML;

    setStatus('Готово. Преобразовано формул: ' + formulas.length, 'ok');
  } catch (err) {
    console.error(err);
    setStatus('Ошибка: ' + err.message, 'error');
  }
}

function escapeHtml(s) {
  return s
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

function escapeNonMath(text) {
  const parts = text.split(/(<math\b[\s\S]*?<\/math>)/gi);
  return parts.map(part => {
    if (/^<math\b/i.test(part)) return part;
    return escapeHtml(part)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }).join('');
}

document.getElementById('convertBtn').addEventListener('click', convertAll);

document.getElementById('copyBtn').addEventListener('click', async () => {
  if (!output.value) return;
  try {
    await navigator.clipboard.writeText(output.value);
    setStatus('Результат скопирован в буфер обмена.', 'ok');
  } catch {
    output.select();
    document.execCommand('copy');
    setStatus('Результат скопирован.', 'ok');
  }
});

document.getElementById('sampleBtn').addEventListener('click', () => {
  input.value = sampleText;
  output.value = '';
  previewBox.innerHTML = '';
  countBox.textContent = 'Формул: 0';
});

document.getElementById('clearBtn').addEventListener('click', () => {
  input.value = '';
  output.value = '';
  previewBox.innerHTML = '';
  countBox.textContent = 'Формул: 0';
});

window.addEventListener('load', waitForMathJax);
</script>
</body>
</html>
